apiVersion: 1

providers:
  - name: llm-usage-exporter
    orgId: 1
    folder: "LLM Usage Exporter"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Grafana watches this directory for *.json dashboards.
      # The repo's dashboards/ folder is mounted here by the docker run.
      path: /var/lib/grafana/dashboards
