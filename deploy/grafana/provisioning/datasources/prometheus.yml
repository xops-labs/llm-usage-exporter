apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # uid matches the ${DS_PROMETHEUS} template variable baked into the
    # shipped dashboard JSON, so auto-import resolves the datasource without prompting.
    uid: DS_PROMETHEUS
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
