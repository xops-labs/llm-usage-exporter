{{- $rawKey := trim (default "" .Values.gemini.serviceAccountKey) -}}
{{- if and .Values.gemini.enabled $rawKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-usage-exporter.geminiKeyfileSecretName" . }}
  labels:
    {{- include "llm-usage-exporter.labels" . | nindent 4 }}
type: Opaque
data:
  gemini-sa.json: {{ $rawKey | b64enc | quote }}
{{- end }}
