apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-usage-exporter.fullname" . }}
  labels:
    {{- include "llm-usage-exporter.labels" . | nindent 4 }}
  {{- if or .Values.service.annotations .Values.prometheusScrape.enabled }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.prometheusScrape.enabled }}
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "llm-usage-exporter.selectorLabels" . | nindent 4 }}
