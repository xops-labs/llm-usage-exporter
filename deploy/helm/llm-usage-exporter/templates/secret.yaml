{{- /*
Provider credentials Secret. Only keys for providers whose `.enabled` flag is true
are rendered. The Secret is always created (even with an empty data map) so the
Deployment's envFrom reference always has a valid target.
*/ -}}
{{- $secretData := dict -}}
{{- if .Values.openai.enabled -}}
  {{- with .Values.openai.adminApiKey }}{{- $_ := set $secretData "OPENAI_ADMIN_API_KEY" (. | b64enc) -}}{{- end -}}
  {{- with .Values.openai.orgId }}{{- $_ := set $secretData "OPENAI_ORG_ID" (. | b64enc) -}}{{- end -}}
{{- end -}}
{{- if .Values.azureOpenAi.enabled -}}
  {{- with .Values.azureOpenAi.tenantId }}{{- $_ := set $secretData "AZURE_OPENAI_TENANT_ID" (. | b64enc) -}}{{- end -}}
  {{- with .Values.azureOpenAi.clientId }}{{- $_ := set $secretData "AZURE_OPENAI_CLIENT_ID" (. | b64enc) -}}{{- end -}}
  {{- with .Values.azureOpenAi.clientSecret }}{{- $_ := set $secretData "AZURE_OPENAI_CLIENT_SECRET" (. | b64enc) -}}{{- end -}}
{{- end -}}
{{- if .Values.anthropic.enabled -}}
  {{- with .Values.anthropic.adminApiKey }}{{- $_ := set $secretData "ANTHROPIC_ADMIN_API_KEY" (. | b64enc) -}}{{- end -}}
{{- end -}}
{{- if .Values.gemini.enabled -}}
  {{- with .Values.gemini.accessToken }}{{- $_ := set $secretData "GEMINI_ACCESS_TOKEN" (. | b64enc) -}}{{- end -}}
  {{- $rawKey := trim (default "" .Values.gemini.serviceAccountKey) -}}
  {{- if $rawKey -}}{{- $_ := set $secretData "GEMINI_SERVICE_ACCOUNT_KEY_JSON" ($rawKey | b64enc) -}}{{- end -}}
{{- end -}}
{{- if .Values.bedrock.enabled -}}
  {{- with .Values.bedrock.accessKeyId }}{{- $_ := set $secretData "AWS_ACCESS_KEY_ID" (. | b64enc) -}}{{- end -}}
  {{- with .Values.bedrock.secretAccessKey }}{{- $_ := set $secretData "AWS_SECRET_ACCESS_KEY" (. | b64enc) -}}{{- end -}}
  {{- with .Values.bedrock.sessionToken }}{{- $_ := set $secretData "AWS_SESSION_TOKEN" (. | b64enc) -}}{{- end -}}
{{- end -}}
{{- if .Values.otel.enabled -}}
  {{- with .Values.otel.headers }}{{- $_ := set $secretData "OTEL_EXPORTER_OTLP_HEADERS" (. | b64enc) -}}{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-usage-exporter.secretName" . }}
  labels:
    {{- include "llm-usage-exporter.labels" . | nindent 4 }}
type: Opaque
{{- if gt (len $secretData) 0 }}
data:
  {{- range $k, $v := $secretData }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
