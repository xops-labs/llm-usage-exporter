name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  # cosign keyless signing + SLSA provenance generator both need the OIDC token to
  # authenticate to Sigstore's Fulcio CA and to mint a signed provenance attestation.
  id-token: write
  # Provenance generator writes attestations back to the repo's release.
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Build & test before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          dotnet-quality: 'ga'

      - name: Restore
        run: dotnet restore llm-usage-exporter.slnx

      - name: Build
        run: dotnet build llm-usage-exporter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test llm-usage-exporter.slnx --configuration Release --no-build --verbosity normal

  docker:
    name: Build & publish container image
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.value }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=llm-usage-exporter
            org.opencontainers.image.description=Prometheus exporter for LLM cost, token usage, and AI spend observability.
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/LlmUsageExporter.Api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + SLSA provenance are embedded into the image manifest by buildx
          # and are independently consumable via `docker buildx imagetools inspect`.
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image with cosign (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          # Sign every published tag at the immutable digest so the signature
          # covers the exact bytes pushed, not whatever a tag may point to later.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            image_ref="${tag%:*}@${DIGEST}"
            echo "Signing $image_ref"
            cosign sign --yes "$image_ref"
          done <<< "$TAGS"

  sbom:
    name: Generate SBOMs (CycloneDX + SPDX)
    runs-on: ubuntu-latest
    needs: docker
    outputs:
      cyclonedx-path: ${{ steps.paths.outputs.cyclonedx }}
      spdx-path: ${{ steps.paths.outputs.spdx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          dotnet-quality: 'ga'

      - name: Restore
        run: dotnet restore llm-usage-exporter.slnx

      - name: Install CycloneDX .NET CLI
        run: dotnet tool install --global CycloneDX --version 5.0.0

      - name: Generate CycloneDX SBOM (source)
        env:
          TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sbom-out
          dotnet CycloneDX src/LlmUsageExporter.Api/LlmUsageExporter.Api.csproj \
            --output sbom-out \
            --filename "llm-usage-exporter-${TAG}.cyclonedx.json" \
            --json \
            --set-version "${TAG#v}"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: 'v1.18.0'

      - name: Generate SPDX SBOM (container image)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image-digest }}
          TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          syft "$IMAGE" \
            -o spdx-json="sbom-out/llm-usage-exporter-${TAG}.spdx.json"

      - name: Compute SBOM output paths
        id: paths
        env:
          TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          echo "cyclonedx=sbom-out/llm-usage-exporter-${TAG}.cyclonedx.json" >> "$GITHUB_OUTPUT"
          echo "spdx=sbom-out/llm-usage-exporter-${TAG}.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Upload SBOMs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-out/*
          if-no-files-found: error

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Attach SPDX SBOM as a cosign attestation to the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image-digest }}
          SPDX_PATH: ${{ steps.paths.outputs.spdx }}
        shell: bash
        run: |
          set -euo pipefail
          cosign attest --yes \
            --predicate "$SPDX_PATH" \
            --type spdxjson \
            "$IMAGE"

  provenance:
    name: SLSA L3 build provenance for container image
    needs: docker
    permissions:
      actions: read
      id-token: write
      packages: write
    # The reusable workflow produces signed in-toto SLSA v1.0 provenance and pushes
    # it to the same registry as a co-located attestation under the image's digest.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.docker.outputs.image-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, docker, sbom, provenance]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sboms
          path: sbom-out

      - name: Extract changelog section for tag
        id: changelog
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file="$(mktemp)"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file" || true
          if [ ! -s "$notes_file" ]; then
            echo "No CHANGELOG entry found for $version — falling back to auto-generated notes." > "$notes_file"
          fi
          {
            echo "notes_path=$notes_file"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          body_path: ${{ steps.changelog.outputs.notes_path }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}
          files: |
            sbom-out/*.cyclonedx.json
            sbom-out/*.spdx.json
