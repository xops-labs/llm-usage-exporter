name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-inventory:
    name: Provider fixture inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify provider replay fixtures and golden snapshots exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/openai-completions-usage.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/openai-costs.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/openai-completions-usage-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/openai-costs-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/openai-completions-usage-empty.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/openai-costs-empty.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/anthropic-messages-usage.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/anthropic-cost-report.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/anthropic-messages-usage-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/anthropic-cost-report-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/azure-monitor-metrics.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/azure-cost-query.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/azure-monitor-metrics-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/azure-cost-query-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/gemini-input-tokens.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/gemini-output-tokens.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/gemini-request-count.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/gemini-billing-costs.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/gemini-input-tokens-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/gemini-output-tokens-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/gemini-request-count-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/gemini-billing-costs-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/bedrock-cloudwatch-input.xml
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/bedrock-cloudwatch-output.xml
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/bedrock-cloudwatch-invocations.xml
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/bedrock-cost-explorer.json
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/bedrock-cloudwatch-input-multi.xml
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/bedrock-cloudwatch-output-multi.xml
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/bedrock-cloudwatch-invocations-multi.xml
            tests/LlmUsageExporter.Tests/Fixtures/provider-payloads/bedrock-cost-explorer-multi.json
            tests/LlmUsageExporter.Tests/Fixtures/golden-metrics/canonical-provider-metrics.prom
            tests/LlmUsageExporter.Tests/Fixtures/golden-metrics/multi-tenancy-provider-metrics.prom
            tests/LlmUsageExporter.Tests/Fixtures/golden-metrics/empty-provider-metrics.prom
          )
          missing=()
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required fixture files:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All replay fixtures and golden snapshots present (${#required[@]} files)."

  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: fixture-inventory
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          dotnet-quality: 'ga'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore llm-usage-exporter.slnx

      - name: Build
        run: dotnet build llm-usage-exporter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test llm-usage-exporter.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Fixture coverage — run replay & golden-snapshot tests in isolation
        # Re-runs the fixture-replay and checkpoint-replay tests as a separate
        # invocation so a regression in those scenarios is easy to spot in the
        # CI log and produces its own .trx artifact for triage. The `--filter`
        # pattern matches both the canonical and multi-tenancy golden tests as
        # well as the FileCheckpointStore / InMemoryCheckpointStore / replay
        # tests.
        run: |
          dotnet test llm-usage-exporter.slnx \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=fixture-coverage.trx" \
            --filter "FullyQualifiedName~FixtureGoldenMetricsTests|FullyQualifiedName~CheckpointReplayTests|FullyQualifiedName~FileCheckpointStoreTests|FullyQualifiedName~InMemoryCheckpointStoreTests"
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exporter image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/LlmUsageExporter.Api/Dockerfile
          push: false
          tags: llm-usage-exporter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-docs:
    name: Markdown sanity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required community files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            NOTICE
            AUTHORS.md
            ADOPTERS.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            MAINTAINERS.md
            ROADMAP.md
            SUPPORT.md
          )
          missing=()
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required files: ${missing[*]}"
            exit 1
          fi
          echo "All required community files present."
