# Configuration for GitHub's auto-generated release notes.
# Triggered when the release workflow (or a human) clicks "Generate release notes".
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - "ignore-for-release"
      - "duplicate"
      - "invalid"
      - "wontfix"
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions[bot]

  categories:
    - title: Breaking changes
      labels:
        - "breaking-change"
        - "breaking"

    - title: New features
      labels:
        - "feature"
        - "enhancement"

    - title: New providers
      labels:
        - "area:azure"
        - "area:anthropic"
        - "area:gemini"
        - "area:bedrock"

    - title: New metrics / labels
      labels:
        - "area:metrics"

    - title: Dashboards
      labels:
        - "area:dashboard"

    - title: Bug fixes
      labels:
        - "bug"

    - title: Security
      labels:
        - "security"

    - title: Documentation
      labels:
        - "docs"
        - "documentation"

    - title: Dependencies
      labels:
        - "dependencies"

    - title: CI and tooling
      labels:
        - "ci"
        - "chore"

    - title: Other changes
      labels:
        - "*"
